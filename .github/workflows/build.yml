name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/ProfilSuara.apk
          cd out && zip ProfilSuara.zip ProfilSuara.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProfilSuara-apk
          path: out/ProfilSuara.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/ProfilSuara.zip out/ProfilSuara.apk \
            --title "Profil Suara (build terbaru)" \
            --notes "Build otomatis dari commit ${{ github.sha }}"
