name: Build Volume Melayang

on:
  push:
    branches: [volume-melayang]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete volumemelayang-log -y --cleanup-tag || true
          gh release create volumemelayang-log build.log --target volume-melayang \
            --title "Volume Melayang build log" --notes "Log build gagal" --prerelease

      - name: Package
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/VolumeMelayang.apk
          cd out && zip VolumeMelayang.zip VolumeMelayang.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete volumemelayang-latest -y --cleanup-tag || true
          gh release create volumemelayang-latest out/VolumeMelayang.zip out/VolumeMelayang.apk \
            --target volume-melayang --latest=false \
            --title "Volume Melayang (build terbaru)" \
            --notes "Build otomatis dari commit ${{ github.sha }}"
