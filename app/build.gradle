plugins {
    id 'com.android.application'
}

android {
    namespace 'id.bram.soundprofile'
    compileSdk 34

    defaultConfig {
        applicationId "id.bram.soundprofile"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "profilsuara"
            keyAlias "profilsuara"
            keyPassword "profilsuara"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
