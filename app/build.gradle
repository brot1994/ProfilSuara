plugins {
    id 'com.android.application'
}

android {
    namespace 'id.bram.volumemelayang'
    compileSdk 34

    defaultConfig {
        applicationId "id.bram.volumemelayang"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "volumemelayang"
            keyAlias "volumemelayang"
            keyPassword "volumemelayang"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
